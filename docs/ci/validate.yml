name: validate

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quality gate
        run: python scripts/check_repo.py
      - name: Script tests
        run: python -m unittest discover -s tests -v
